<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyNovelAI — Coming Soon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffffff, #eef4ff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #1a1a1a;
    }

    .container {
      text-align: center;
      padding: 40px;
      backdrop-filter: blur(14px);
      background: rgba(255, 255, 255, 0.45);
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
      max-width: 550px;
      width: 90%;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 110px;
      height: 110px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    p {
      font-size: 1rem;
      margin-bottom: 25px;
      opacity: 0.8;
    }

    .notify-box {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    input {
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid #c7d4ff;
      outline: none;
      width: 65%;
      font-size: 1rem;
    }

    button {
      padding: 14px 22px;
      background: #4c7dff;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 16px rgba(76, 125, 255, 0.4);
    }

    button:hover {
      background: #3c6af2;
    }

    footer {
      margin-top: 30px;
      font-size: 0.85rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" class="logo" alt="Logo">
    <h1>Something Magical Is Coming</h1>
    <p>MyNovelAI is crafting a powerful AI writing companion for all fiction creators. Stay tuned. </p>

    <div class="notify-box">
      <input type="email" placeholder="Enter your email" />
      <button>Notify Me</button>
    </div>

    <footer>© 2025 MyNovelAI — All rights reserved.</footer>
  </div>
</body>
</html>
